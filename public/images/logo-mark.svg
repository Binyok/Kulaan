<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Logo mark Kulaan">
  <!-- Batang K: dua kotak paket bertumpuk -->
  <rect x="10" y="9" width="14" height="21" rx="2.5" fill="#2D6A4F"/>
  <rect x="10" y="34" width="14" height="21" rx="2.5" fill="#2D6A4F"/>
  <!-- Lengan K: kotak diagonal ke kanan-atas (aksen brass) -->
  <rect x="25.5" y="16" width="30" height="14" rx="2.5" fill="#D4A017" transform="rotate(-40 40.5 23)"/>
  <!-- Kaki K: kotak diagonal ke kanan-bawah -->
  <rect x="25.5" y="34" width="30" height="14" rx="2.5" fill="#2D6A4F" transform="rotate(40 40.5 41)"/>
</svg>
